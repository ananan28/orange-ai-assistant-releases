name: Orange AI 1.0.42 test installer
on:
  push:
    branches: [restore/windows-1.0.42]
    paths: [orange-source-1.0.42.zip, .github/workflows/windows-1.0.42-test.yml]
permissions:
  contents: read
concurrency:
  group: orange-1.0.42-test
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract restored project
        shell: pwsh
        run: Expand-Archive -LiteralPath orange-source-1.0.42.zip -DestinationPath restored
      - name: Install locked dependencies
        working-directory: restored
        run: npm ci --no-audit --no-fund
      - name: Validate source and regression tests
        working-directory: restored
        run: npm run check
      - name: Build test installer without publishing
        working-directory: restored
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Launch login UI smoke test
        working-directory: restored
        run: node scripts/smoke-login-ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Orange-AI-Assistant-1.0.42-test
          path: |
            restored/dist/*.exe
            restored/dist/*.blockmap
            restored/dist/latest.yml
          if-no-files-found: error
          retention-days: 7
