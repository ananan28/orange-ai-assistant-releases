name: Orange AI 1.0.44 desktop test
on:
  push:
    branches: [build/1.0.44-test]
    paths:
      - .github/workflows/desktop-1.0.44-test.yml
      - orange-source-1.0.44-candidate.zip
      - investigation/orange-performance-investigation-overlay.zip
      - build-input/orange-build-1.0.44-overlay.zip
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            script: dist:win
            artifact: Orange-AI-Assistant-1.0.44-Windows-x64-test
          - runner: macos-14
            script: dist:mac
            artifact: Orange-AI-Assistant-1.0.44-macOS-arm64-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and reconstruct source
        shell: python
        run: |
          import hashlib, zipfile
          from pathlib import Path
          archives = [
            ("orange-source-1.0.44-candidate.zip", "9eca065ef5a8758ba149cd2eaf49224e74d2ccfa71618549d2a5169a33bd412a"),
            ("investigation/orange-performance-investigation-overlay.zip", "4cb64fa39000bb6e0fea8edfb83112980770305553a3d8469b9647f29aeb47e6"),
            ("build-input/orange-build-1.0.44-overlay.zip", "54be94134277cc94b13c3516278d115ea52be64a7578d1385eaebdf83cd18caf")
          ]
          for filename, digest in archives:
            assert hashlib.sha256(Path(filename).read_bytes()).hexdigest() == digest, filename
            with zipfile.ZipFile(filename) as archive:
              archive.extractall("restored")
          with zipfile.ZipFile("orange-source-1.0.43.zip") as archive:
            for filename in ["main.js", "site-preload.js", "extension-source/ai_reply.js"]:
              archive.extract(filename, "baseline")
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: restored/package-lock.json
      - name: Install locked dependencies
        working-directory: restored
        run: npm ci --no-audit --no-fund
      - name: Regression checks
        working-directory: restored
        run: npm run check
      - name: Common overhead source comparison
        working-directory: restored
        run: node scripts/audit-common-overhead.cjs ../baseline
      - name: Build test installer without publishing
        working-directory: restored
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}
      - name: Packaged login UI
        working-directory: restored
        run: node scripts/smoke-login-ui.cjs
      - name: Verify native Mac architecture
        if: runner.os == 'macOS'
        working-directory: restored
        run: file dist/mac-arm64/*.app/Contents/MacOS/*
      - name: Package source used by this build
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          root = Path("restored")
          with zipfile.ZipFile("Orange-AI-Assistant-1.0.44-source.zip", "w", zipfile.ZIP_DEFLATED) as archive:
            for file in sorted(root.rglob("*")):
              relative = file.relative_to(root)
              if file.is_file() and not set(relative.parts).intersection({"node_modules", "dist", "release-app", "release-extension"}):
                archive.write(file, relative)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            restored/dist/*.exe
            restored/dist/*.dmg
            restored/dist/*.zip
            restored/dist/*.blockmap
            restored/dist/latest*.yml
            Orange-AI-Assistant-1.0.44-source.zip
          if-no-files-found: error
          retention-days: 14
